name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

  build-sanitized:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build-sanitized -DENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-sanitized --config Release

      - name: Run week02 target under sanitizers
        run: ./build-sanitized/cpp/week02/week02_raii
